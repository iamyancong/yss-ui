name: Release Packages to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry-run mode (preview version bumps and publish without executing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify CI & Publish Packages to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Wait & Verify CI / CD Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          node scripts/verify-ci-status.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.10.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          STORE_DIR=$(pnpm store path --silent | tail -n 1)
          echo "STORE_PATH=$STORE_DIR" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fast Pre-release Check
        run: |
          node scripts/check-registry-artifacts.mjs
          node scripts/release-changed.js "${{ inputs.bump }}" --dry

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute Release Scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_REGISTRY: "https://registry.npmjs.org/"
        run: |
          BUMP_TYPE="${{ inputs.bump }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 Running release in dry-run mode..."
            node scripts/release-changed.js "$BUMP_TYPE" --dry
          else
            echo "🚀 Executing release..."
            node scripts/release-changed.js "$BUMP_TYPE"
          fi

      - name: Commit, Push & Tag Version Bumps
        if: ${{ inputs.dry_run != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          node scripts/ci-post-release.js

      - name: Verify Published MCP Tarball
        if: ${{ inputs.dry_run != true }}
        run: node scripts/verify-published-release.mjs --registry=https://registry.npmjs.org/ --retries=32

      - name: Send Notification (Optional)
        if: ${{ inputs.dry_run != true }}
        env:
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
          DOCS_BASE_URL: "https://iamyancong.github.io/yss-ui"
        run: |
          if [ -n "$WECOM_WEBHOOK_KEY" ]; then
            node scripts/wecom-notify.js || echo "Notification failed"
          else
            echo "No WECOM_WEBHOOK_KEY provided, skip notification."
          fi
